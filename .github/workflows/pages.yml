# web/ 폴더를 GitHub Pages로 배포
# 준비: Settings → Pages → Source: GitHub Actions
#       Settings → Secrets and variables → Actions → Variables
#         SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: config.js 생성 (저장소 Variables 사용)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY 변수가 없어 데모 모드로 배포합니다."
          fi
          case "$SUPABASE_KEY" in
            sb_secret_*) echo "::error::secret key는 웹에 넣으면 안 됩니다. Publishable key를 쓰세요."; exit 1 ;;
          esac
          printf 'window.TREE_CONFIG = { SUPABASE_URL: %s, SUPABASE_KEY: %s };\n' \
            "$(jq -Rn --arg v "$SUPABASE_URL" '$v')" "$(jq -Rn --arg v "$SUPABASE_KEY" '$v')" > web/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
